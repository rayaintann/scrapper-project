<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Autometric Commercial — enterprise KOL intelligence, discovery, campaign management and reporting platform.">
<title>Autometric Commercial — KOL Intelligence Platform</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>

:root{
  --p1:#f6f9fc;--p2:#eef5fb;--p3:#e6f0fa;--p4:#d9e8f8;--p6:#b6d0ed;--p8:#7fafd9;--p9:#5d95c8;--p10:#3d7e96;
  --primary:#3d7e96;--primary-deep:#28607a;
  --lav:#b9c7f7;--lav-ink:#7e8ce4;--lav-bg:#f0f1fe;
  --mint:#8fd6c4;--mint-ink:#3d9a86;--mint-bg:#e3f4f0;
  --blush:#f4d7e7;--blush-ink:#d97bab;--blush-bg:#fcf1f7;
  --peach:#f7e7dd;--peach-ink:#dd9264;--peach-bg:#fdf4ee;
  --card:#fff;--border:#e3eef8;--border-2:#eef4fa;
  --t1:#1c2a34;--t2:#3a4b57;--t3:#647581;--t4:#95a6b2;
  --success:#3d9a86;--success-bg:#e3f4f0;--success-bd:#c6e8e0;
  --warning:#c99a4f;--warning-bg:#fbf3e4;--warning-bd:#f0e2c4;
  --danger:#dd7a6a;--danger-bg:#fceeeb;--danger-bd:#f3d4cc;
  --pj:'Plus Jakarta Sans',sans-serif;--in:'Inter',sans-serif;
  --shadow:0 1px 2px rgba(61,126,150,.05),0 4px 14px rgba(61,126,150,.06);
  --shadow-md:0 12px 32px rgba(61,126,150,.12);--shadow-lg:0 26px 56px rgba(45,80,110,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--in);background:#dce7f1;color:var(--t1);-webkit-font-smoothing:antialiased;padding:42px 0 90px;
  background-image:radial-gradient(900px 500px at 20% 0%,#e7f0f9,transparent),radial-gradient(800px 500px at 90% 100%,#e3ecf7,transparent),linear-gradient(180deg,#dce7f1,#d6e2ee)}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;font-family:'Material Symbols Outlined';user-select:none}
.fill{font-variation-settings:'FILL' 1}
.frame{width:1440px;margin:0 auto}
.frame-head{margin:0 0 14px 2px}
.frame-head .eyebrow{font-family:var(--pj);font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;background:linear-gradient(90deg,#3d7e96,#7e8ce4);-webkit-background-clip:text;background-clip:text;color:transparent}
.frame-head h1{font-family:var(--pj);font-size:25px;font-weight:800;letter-spacing:-.03em;color:#243642;margin-top:7px}
.hint{display:inline-flex;align-items:center;gap:6px;margin-top:11px;font-family:var(--pj);font-size:11.5px;font-weight:600;color:var(--primary-deep);background:#eaf4f9;border:1px solid #cfe4ec;border-radius:999px;padding:6px 13px}
.hint .material-symbols-outlined{font-size:15px}

.artboard{position:relative;width:1440px;height:940px;border-radius:24px;overflow:hidden;display:flex;box-shadow:var(--shadow-lg);border:1px solid #cfdeeb;background:var(--p1)}

/* sidebar */
.sidebar{width:250px;flex-shrink:0;background:linear-gradient(195deg,#f3f8fd,#e8f1fa);border-right:1px solid #dbe8f4;display:flex;flex-direction:column;position:relative;overflow:hidden}
.sidebar::before{content:'';position:absolute;top:-50px;right:-50px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(185,199,247,.4),transparent 70%)}
.sb-logo{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid rgba(61,126,150,.1);position:relative;z-index:2}
.sb-logo img{height:22px}
.sb-org{padding:11px 12px;position:relative;z-index:2}
.org-switch{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:13px;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.65);box-shadow:var(--shadow);cursor:pointer}
.org-av{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#8f9be8,#6f7cd8);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--pj);font-weight:700;font-size:10.5px}
.org-name{flex:1;font-family:var(--pj);font-size:12.5px;font-weight:700;color:var(--t1)}
.org-name small{display:block;font-size:10px;font-weight:500;color:var(--t4)}
.org-switch .material-symbols-outlined{color:var(--t4);font-size:17px}
.nav{flex:1;padding:6px 12px;display:flex;flex-direction:column;gap:2px;position:relative;z-index:2;overflow-y:auto}
.nav::-webkit-scrollbar{width:0}
.nav-g{font-family:var(--pj);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:#a3b3c0;padding:12px 10px 5px}
.nav-item{display:flex;align-items:center;gap:11px;height:36px;padding:0 11px;border-radius:11px;font-family:var(--pj);font-size:12.5px;font-weight:600;color:var(--t3);text-decoration:none;position:relative;transition:.15s;cursor:pointer}
.nav-item .material-symbols-outlined{font-size:18px;color:var(--t4)}
.nav-item:hover{background:rgba(255,255,255,.6);color:var(--t2)}
.nav-item .badge{margin-left:auto;font-family:var(--pj);font-size:9px;font-weight:800;color:#fff;background:linear-gradient(135deg,#8f9be8,#6f7cd8);border-radius:999px;padding:2px 7px}
.nav-item.active{background:linear-gradient(100deg,#fff,#eaf3fb);color:var(--primary-deep);box-shadow:var(--shadow)}
.nav-item.active .material-symbols-outlined{color:var(--primary)}
.nav-item.active::before{content:'';position:absolute;left:-12px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--primary)}
.sb-user{border-top:1px solid rgba(61,126,150,.1);padding:9px 12px;position:relative;z-index:2}
.user-row{display:flex;align-items:center;gap:10px;padding:7px;border-radius:11px;cursor:pointer}
.user-row:hover{background:rgba(255,255,255,.6)}
.user-av{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#5d95c8,#3d7e96);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--pj);font-weight:700;font-size:11px}
.user-name{font-family:var(--pj);font-size:12px;font-weight:700;color:var(--t1)}
.user-mail{font-size:10.5px;color:var(--t4)}
.user-row .material-symbols-outlined{color:var(--t4);font-size:17px}

/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:radial-gradient(720px 360px at 100% -8%,#e6f0fa,transparent),radial-gradient(560px 320px at -6% 4%,#f0f1fe,transparent),linear-gradient(180deg,#f6f9fc,#eef5fb)}
.topbar{height:60px;flex-shrink:0;background:rgba(255,255,255,.66);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.7);padding:0 22px;display:flex;align-items:center;gap:14px;z-index:30}
.back{width:32px;height:32px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;color:var(--t3);cursor:pointer}
.back:hover{color:var(--primary)}
.tb-crumb{display:flex;align-items:center;gap:7px;font-family:var(--pj);font-size:12.5px;font-weight:600;color:var(--t3)}
.tb-crumb b{color:var(--t1);font-weight:800}
.tb-crumb .material-symbols-outlined{font-size:15px;color:var(--t4)}
.tb-tools{margin-left:auto;display:flex;align-items:center;gap:9px}
.searchbar{display:flex;align-items:center;gap:8px;height:36px;width:230px;padding:0 12px;border:1px solid var(--border);border-radius:11px;background:rgba(255,255,255,.75)}
.searchbar .material-symbols-outlined{font-size:17px;color:var(--t4)}
.searchbar input{border:none;background:none;outline:none;flex:1;font-family:var(--in);font-size:12.5px;color:var(--t2)}
.searchbar .kbd{font-family:var(--pj);font-size:9.5px;font-weight:700;color:var(--t4);background:#fff;border:1px solid var(--border);border-radius:6px;padding:2px 5px}
.ibtn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.75);border:1px solid var(--border);border-radius:11px;color:var(--t3);position:relative;cursor:pointer}
.ibtn:hover{color:var(--primary)}
.ibtn .material-symbols-outlined{font-size:19px}
.ibtn .ndot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--blush-ink);border:2px solid #fff}
.tb-user{display:flex;align-items:center;gap:7px;height:36px;padding:0 6px 0 8px;border:1px solid var(--border);border-radius:11px;background:rgba(255,255,255,.75);cursor:pointer}
.tb-user .ua{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#5d95c8,#3d7e96);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--pj);font-weight:700;font-size:10px}
.tb-user .un{font-family:var(--pj);font-size:12px;font-weight:700;color:var(--t1)}
.tb-user .material-symbols-outlined{font-size:17px;color:var(--t4)}

/* module sub-nav */
.subnav{flex-shrink:0;display:flex;gap:3px;padding:9px 20px 0;background:rgba(255,255,255,.4);border-bottom:1px solid var(--border);overflow-x:auto}
.subnav::-webkit-scrollbar{height:0}
.snav{display:flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:10px 10px 0 0;font-family:var(--pj);font-size:12.5px;font-weight:700;color:var(--t3);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s}
.snav .material-symbols-outlined{font-size:17px}
.snav:hover{color:var(--t2);background:rgba(255,255,255,.5)}
.snav.on{color:var(--primary-deep);border-bottom-color:var(--primary);background:rgba(255,255,255,.7)}

.view{flex:1;overflow-y:auto;padding:20px 22px 34px}
.view::-webkit-scrollbar{width:8px}.view::-webkit-scrollbar-thumb{background:#d5e2ee;border-radius:8px}

/* shared */
.phead{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:6px;gap:16px}
.phead h2{font-family:var(--pj);font-size:21px;font-weight:800;letter-spacing:-.03em;color:var(--t1)}
.phead p{font-size:12.5px;color:var(--t3);margin-top:5px}
.section{display:flex;align-items:center;gap:10px;margin:22px 0 13px}
.section .ic{width:25px;height:25px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:var(--shadow)}
.section .ic .material-symbols-outlined{font-size:15px}
.section span.lbl{font-family:var(--pj);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--t2)}
.section .rule{flex:1;height:1px;background:var(--border-2)}
.section .act{font-family:var(--pj);font-size:11.5px;font-weight:700;color:var(--primary);cursor:pointer}
.grid{display:grid;gap:16px}
.card{background:linear-gradient(180deg,#fff,#f8fbfe);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow)}
.card-hd{display:flex;align-items:flex-start;justify-content:space-between;padding:15px 17px 11px;gap:12px}
.card-hd h3{font-family:var(--pj);font-size:13px;font-weight:800;color:var(--t1)}
.card-hd .csub{font-size:11px;color:var(--t4);margin-top:3px}
.pad{padding:6px 17px 17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;font-family:var(--pj);font-size:12.5px;font-weight:700;border-radius:11px;cursor:pointer;border:none;white-space:nowrap;transition:.15s}
.btn .material-symbols-outlined{font-size:17px}
.btn-primary{background:linear-gradient(135deg,#5d95c8,#3d7e96);color:#fff;box-shadow:0 4px 12px rgba(61,126,150,.3)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-secondary{background:#e6f0fa;color:var(--primary-deep);border:1px solid #d0e2f2}
.btn-secondary:hover{background:#dcebf6}
.btn-ghost{background:rgba(255,255,255,.9);color:var(--t2);border:1px solid var(--border)}
.btn-ghost:hover{background:#f4f8fc}
.btn-sm{height:31px;padding:0 12px;font-size:11.5px;border-radius:10px}
.icon-only{width:36px;padding:0}.icon-only.sm{width:31px;height:31px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,.85);font-family:var(--pj);font-size:12px;font-weight:600;color:var(--t2);cursor:pointer;transition:.15s;user-select:none}
.fchip:hover{background:#f2f7fc}
.fchip.on{background:linear-gradient(135deg,#e6f0fa,#dbeaf7);border-color:#cfe0f1;color:var(--primary-deep)}
.fchip .material-symbols-outlined{font-size:14px;color:var(--t4)}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,.85);font-family:var(--pj);font-size:12px;font-weight:600;color:var(--t2);cursor:pointer}
.pill .material-symbols-outlined{font-size:16px;color:var(--t4)}
.search2{position:relative;display:flex;align-items:center}
.search2 .material-symbols-outlined{position:absolute;left:11px;font-size:17px;color:#b4c3d0}
.search2 input{height:38px;width:280px;padding:0 12px 0 34px;border:1px solid var(--border);border-radius:12px;font-family:var(--in);font-size:13px;background:#fff;outline:none;color:var(--t1)}
.search2 input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(61,126,150,.13)}

/* KPI */
.kpi{position:relative;overflow:hidden;padding:14px 15px;border-radius:16px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--border);box-shadow:var(--shadow)}
.kpi .chip{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.kpi .chip .material-symbols-outlined{font-size:18px}
.kpi-top{display:flex;align-items:center;gap:8px}
.kpi .lbl{font-family:var(--pj);font-size:10.5px;font-weight:700;color:var(--t3);line-height:1.2}
.kpi-val{font-family:var(--pj);font-size:20px;font-weight:800;color:var(--t1);letter-spacing:-.02em}
.kpi .ksub{font-size:10.5px;color:var(--t4)}
.kpi-hero{position:relative;border-radius:18px;padding:17px;color:#fff;overflow:hidden;box-shadow:var(--shadow-md);display:flex;flex-direction:column;gap:9px;min-height:120px}
.kpi-hero .fb{position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.kpi-hero .kl{font-family:var(--pj);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,.85);display:flex;align-items:center;gap:6px;position:relative;z-index:2}
.kpi-hero .kv{font-family:var(--pj);font-size:27px;font-weight:800;letter-spacing:-.03em;position:relative;z-index:2}
.kpi-hero .kd{position:relative;z-index:2;font-family:var(--pj);font-size:10.5px;font-weight:700;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.26);border-radius:8px;padding:3px 8px;width:fit-content}
.delta{display:inline-flex;align-items:center;gap:2px;font-family:var(--pj);font-weight:700;font-size:10.5px;padding:2px 6px;border-radius:7px}
.delta .material-symbols-outlined{font-size:12px}
.delta.up{color:var(--success);background:var(--success-bg)}.delta.down{color:var(--danger);background:var(--danger-bg)}

.leg{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--t3)}
.leg .sw{width:10px;height:10px;border-radius:3px}.leg .sw.line{width:14px;height:3px}
.hbar-row{display:flex;align-items:center;gap:11px;padding:6px 0}
.hbar-row .hn{font-size:12px;color:var(--t2);font-weight:500;width:130px;flex-shrink:0}
.hbar{flex:1;height:9px;border-radius:5px;background:#e6eef6;overflow:hidden}
.hbar>div{height:100%;border-radius:5px}
.hbar-row .hv{font-family:var(--pj);font-size:12px;font-weight:700;color:var(--t2);width:44px;text-align:right}
.gl-row{display:flex;align-items:center;justify-content:space-between}
.gl-row .gll{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t3);font-weight:600}
.gl-row .glv{font-family:var(--pj);font-size:14px;font-weight:800;color:var(--t1)}

table{width:100%;border-collapse:collapse}
thead tr{background:linear-gradient(180deg,#f4f9fd,#eef5fb)}
th{font-family:var(--pj);text-align:left;padding:10px 15px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t4);white-space:nowrap;border-bottom:1px solid var(--border-2)}
td{padding:12px 15px;font-size:12px;color:var(--t2);border-bottom:1px solid #eef4fa;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.hov:hover{background:#f7fbfe}
.num{font-family:var(--pj);font-weight:700;color:var(--t2)}
.tag{display:inline-flex;align-items:center;font-family:var(--pj);font-size:10px;font-weight:700;padding:3px 9px;border-radius:8px}
.st{display:inline-flex;align-items:center;gap:5px;font-family:var(--pj);font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:999px}
.st .d{width:6px;height:6px;border-radius:50%}
.st.win{color:var(--success);background:var(--success-bg)}.st.win .d{background:var(--success)}
.st.live{color:var(--lav-ink);background:var(--lav-bg)}.st.live .d{background:var(--lav-ink)}
.st.avg{color:var(--warning);background:var(--warning-bg)}.st.avg .d{background:var(--warning)}
.st.err{color:var(--danger);background:var(--danger-bg)}.st.err .d{background:var(--danger)}
.mini-av{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--pj);font-weight:700;font-size:11px;flex-shrink:0}
.avpair{display:flex;align-items:center;gap:10px}
.plat-ic{width:14px;height:14px;object-fit:contain}
.match{font-family:var(--pj);font-size:10.5px;font-weight:800;color:#1f8b6f;background:var(--success-bg);border:1px solid var(--success-bd);border-radius:999px;padding:2px 8px}

/* list creator card */
.kcard{position:relative;border:1px solid var(--border);border-radius:18px;overflow:hidden;background:#fff;box-shadow:var(--shadow);transition:.16s;cursor:pointer}
.kcard:hover{box-shadow:var(--shadow-md);transform:translateY(-3px);border-color:#cfe0f1}
.kcard .kbanner{height:56px;position:relative;overflow:hidden}
.kcard .kbanner .bb{position:absolute;border-radius:50%;background:rgba(255,255,255,.16)}
.kcard .ktop{position:absolute;top:9px;right:9px;display:flex;gap:6px;z-index:3}
.ic-toggle{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;color:var(--t3);cursor:pointer;transition:.15s}
.ic-toggle:hover{color:var(--primary)}
.ic-toggle.on{color:var(--blush-ink)}
.ic-toggle.cmpon{background:var(--primary);color:#fff;border-color:var(--primary)}
.ic-toggle.carton{background:var(--mint-ink);color:#fff;border-color:var(--mint-ink)}
.ibtn .cartn{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--primary);color:#fff;font-family:var(--pj);font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff;line-height:1}
.cart-steps{display:flex;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:0}
.cart-step{display:flex;align-items:center;gap:9px;cursor:pointer}
.cart-step .csn{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--pj);font-size:12px;font-weight:800;background:#eef4fa;color:var(--t4);border:1px solid var(--border);flex-shrink:0}
.cart-step.on .csn{background:linear-gradient(135deg,#5d95c8,#3d7e96);color:#fff;border-color:transparent}
.cart-step.done .csn{background:var(--success);color:#fff;border-color:transparent}
.cart-step .csl{font-family:var(--pj);font-size:12px;font-weight:700;color:var(--t4);white-space:nowrap}
.cart-step.on .csl,.cart-step.done .csl{color:var(--t2)}
.cart-line{width:44px;height:2px;background:var(--border);margin:0 10px;flex-shrink:0}
.cart-line.done{background:var(--success)}
.cart-row{display:flex;align-items:center;gap:13px;padding:12px 4px;border-bottom:1px solid var(--border-2)}
.cart-row:last-child{border-bottom:none}
.obj-chip{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 10px;border:1.5px solid var(--border);border-radius:14px;cursor:pointer;background:#fff;transition:.15s;text-align:center}
.obj-chip:hover{border-color:#cfe0f1}
.obj-chip.on{border-color:var(--primary);background:linear-gradient(160deg,#eef6fc,#fff)}
.obj-chip .material-symbols-outlined{font-size:22px;color:var(--t4)}
.obj-chip.on .material-symbols-outlined{color:var(--primary)}
.obj-chip .ol{font-family:var(--pj);font-size:11.5px;font-weight:700;color:var(--t2)}
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:12.5px;color:var(--t3)}
.sum-row b{color:var(--t1);font-family:var(--pj)}
.sum-row.total{border-top:1px solid var(--border);margin-top:6px;padding-top:12px;font-size:14px}
.sum-row.total b{font-size:16px;color:var(--primary-deep)}
.pay-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:13px 8px;border:1.5px solid var(--border);border-radius:13px;cursor:pointer;background:#fff}
.pay-tab.on{border-color:var(--primary);background:linear-gradient(160deg,#eef6fc,#fff)}
.pay-tab .material-symbols-outlined{font-size:20px;color:var(--t4)}
.pay-tab.on .material-symbols-outlined{color:var(--primary)}
.pay-tab span.pl{font-family:var(--pj);font-size:11.5px;font-weight:700;color:var(--t2)}
.confirm-check{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#3d9a86,#5fc0a5);display:flex;align-items:center;justify-content:center;color:#fff;margin:0 auto 16px}
.confirm-check .material-symbols-outlined{font-size:38px}
.ic-toggle .material-symbols-outlined{font-size:17px}
.kcard .kav{width:60px;height:60px;border-radius:17px;border:4px solid #fff;margin:-34px 0 0 16px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--pj);font-weight:800;font-size:22px;position:relative;box-shadow:var(--shadow)}
.kcard .kav .vb{position:absolute;bottom:-2px;right:-2px;width:20px;height:20px;border-radius:50%;background:#3d7e96;border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff}
.kcard .kav .vb .material-symbols-outlined{font-size:12px}
.kcard .kbody{padding:8px 16px 15px}
.kcard .kname{font-family:var(--pj);font-size:15px;font-weight:800;color:var(--t1);display:flex;align-items:center;gap:6px}
.kcard .khandle{font-size:11.5px;color:var(--t4);margin-top:1px}
.kcard .kcat{display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-family:var(--pj);font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:8px;background:var(--p3);color:var(--primary-deep)}
.kcard .kstats{display:flex;gap:6px;margin-top:13px}
.kcard .kstat{flex:1;background:#f7fafd;border:1px solid var(--border-2);border-radius:11px;padding:8px 6px;text-align:center}
.kcard .kstat .sv{font-family:var(--pj);font-size:13.5px;font-weight:800;color:var(--t1)}
.kcard .kstat .sl{font-size:9px;color:var(--t4);margin-top:2px;text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.kcard .kfoot{display:flex;align-items:center;justify-content:space-between;margin-top:13px}
.kcard .kplats{display:flex;gap:5px}

/* pagination */
.pagec{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:22px}
.pgbtn{min-width:34px;height:34px;padding:0 8px;border-radius:10px;border:1px solid var(--border);background:#fff;font-family:var(--pj);font-size:12.5px;font-weight:700;color:var(--t3);cursor:pointer;display:flex;align-items:center;justify-content:center}
.pgbtn:hover{background:#f2f7fc}
.pgbtn.on{background:linear-gradient(135deg,#5d95c8,#3d7e96);color:#fff;border-color:transparent}

/* ai / callout */
.ai-card{position:relative;border-radius:18px;padding:1.5px;background:linear-gradient(120deg,#b9c7f7,#7fafd9,#f4d7e7);box-shadow:0 10px 26px rgba(127,175,217,.2)}
.ai-in{background:linear-gradient(180deg,#fff,#f8fbfe);border-radius:16.5px;padding:15px 17px}
.ai-hd{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.ai-badge{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#8f9be8,#6f7cd8);display:flex;align-items:center;justify-content:center;color:#fff}
.ai-badge .material-symbols-outlined{font-size:20px}
.ai-hd .at{font-family:var(--pj);font-size:13.5px;font-weight:800;color:var(--t1)}
.ai-hd .as{font-size:10.5px;color:var(--t4)}
.ai-item{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--border-2)}
.ai-item .aic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ai-item .aic .material-symbols-outlined{font-size:15px}
.ai-item .ab{font-size:12px;line-height:1.5;color:var(--t2)}.ai-item .ab b{color:var(--t1);font-family:var(--pj);font-weight:700}
.callout{display:flex;align-items:flex-start;gap:10px;padding:13px 15px;border-radius:15px;border:1px solid var(--success-bd);background:linear-gradient(135deg,#e6f5f1,#e0f2ec)}
.callout .cl{font-family:var(--pj);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--success);margin-bottom:3px}
.callout .cb{font-size:12px;line-height:1.5;color:#4b5563}.callout .cb b{color:var(--t1);font-family:var(--pj)}

/* map + heat */
.map{position:relative;height:210px;border-radius:14px;background:radial-gradient(circle at 30% 40%,#e6f0fa,#f6f9fc);border:1px solid var(--border-2);overflow:hidden;background-image:radial-gradient(#d4e3f0 1px,transparent 1px);background-size:15px 15px}
.map-bubble{position:absolute;border-radius:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--pj);font-weight:800;box-shadow:0 6px 16px rgba(45,80,110,.2)}
.map-bubble .lb{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;font-size:9.5px;font-weight:700;color:var(--t2);white-space:nowrap;background:rgba(255,255,255,.88);padding:1px 6px;border-radius:6px}
.heat{display:flex;flex-direction:column;gap:5px}
.heat-row{display:flex;align-items:center;gap:8px}
.heat-row .hd{font-size:10px;font-weight:600;color:var(--t3);width:26px;text-align:right}
.heat-cells{display:flex;gap:5px;flex:1}.heat-cells>div{flex:1;height:20px;border-radius:5px}
.heat-x{display:flex;gap:5px;margin-left:34px}.heat-x span{flex:1;font-size:9px;color:var(--t4);text-align:center}

/* post */
.post{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:#fff;box-shadow:var(--shadow);cursor:pointer;transition:.15s}
.post:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.post .pthumb{height:110px;display:flex;align-items:center;justify-content:center;position:relative}
.post .pthumb .material-symbols-outlined{font-size:30px;color:#fff}
.post .pthumb .pl{position:absolute;top:8px;left:8px;width:22px;height:22px;border-radius:7px;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center}
.post .pthumb .pl img{width:13px;height:13px}
.post .pthumb .pv{position:absolute;bottom:8px;right:8px;font-family:var(--pj);font-size:10.5px;font-weight:800;color:#fff;background:rgba(0,0,0,.28);border-radius:7px;padding:2px 7px}
.post .pbody{padding:9px 11px}
.post .pmetrics{display:flex;gap:11px;margin-top:7px}
.post .pm{display:flex;align-items:center;gap:3px;font-size:10.5px;color:var(--t3);font-weight:600}
.post .pm .material-symbols-outlined{font-size:13px;color:var(--t4)}

/* timeline */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:linear-gradient(180deg,#7fafd9,#e6f0fa)}
.tl-item{position:relative;padding:0 0 16px 4px}.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-21px;top:2px;width:13px;height:13px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #d9e8f8}
.tl-t{font-family:var(--pj);font-size:12px;font-weight:700;color:var(--t1)}
.tl-d{font-size:11px;color:var(--t3);margin-top:2px}
.tl-time{font-size:10px;color:var(--t4);margin-top:2px;font-weight:600;font-family:var(--pj)}

/* activity */
.act-row{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid #eef4fa}.act-row:last-child{border-bottom:none}
.act-ic{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.act-ic .material-symbols-outlined{font-size:15px}

/* expandable camp */
.camp-row{cursor:pointer}.camp-row:hover{background:#f7fbfe}
.camp-detail{display:none}.camp-detail.open{display:table-row}
.camp-detail td{background:#f6faff;padding:0}
.cdin{padding:14px 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.cd .cv{font-family:var(--pj);font-size:14px;font-weight:800;color:var(--t1)}.cd .cl{font-size:10px;color:var(--t4);margin-top:2px}

/* compare columns */
.cmpgrid{display:grid;gap:14px}
.cmpcol{border:1px solid var(--border);border-radius:18px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}
.cmpcol .ch{padding:16px;color:#fff;text-align:center}
.cmpcol .ca{width:56px;height:56px;border-radius:16px;margin:0 auto 9px;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-family:var(--pj);font-weight:800;font-size:20px}
.cmpcol .cn{font-family:var(--pj);font-size:15px;font-weight:800}
.cmpcol .ci{font-size:11px;color:rgba(255,255,255,.82);margin-top:2px}
.cmprow{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:1px solid var(--border-2)}
.cmprow:last-child{border-bottom:none}
.cmprow .cl{font-size:11px;color:var(--t4);font-weight:600}
.cmprow .cvv{font-family:var(--pj);font-size:14px;font-weight:800;color:var(--t1)}
.cmprow .best{color:var(--success)}

/* skeleton */
@keyframes shimmer{0%{background-position:-500px 0}100%{background-position:500px 0}}
.sk{background:linear-gradient(90deg,#eef2f6 25%,#f8fafc 37%,#eef2f6 63%);background-size:900px 100%;animation:shimmer 1.3s infinite linear;border-radius:10px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:50px 20px;gap:5px}
.empty h4{font-family:var(--pj);font-size:15px;font-weight:800;color:var(--t1);margin-top:10px}
.empty p{font-size:12.5px;color:var(--t4);max-width:320px;line-height:1.5}

/* toggle switch */
.switch{width:38px;height:22px;border-radius:12px;background:#c9d7e2;position:relative;flex-shrink:0;cursor:pointer;transition:.2s}
.switch.on{background:linear-gradient(135deg,#5d95c8,#3d7e96)}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:.2s}
.switch.on::after{left:18px}
.acct-row{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid #eef4fa}.acct-row:last-child{border-bottom:none}
.acct-ic{width:38px;height:38px;border-radius:11px;background:#f2f7fc;border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.acct-ic img{width:20px;height:20px;object-fit:contain}

/* dropdown / menu */
.menu{position:absolute;background:#fff;border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow-md);padding:6px;z-index:50;min-width:180px;animation:pop .15s ease}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.menu a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-family:var(--pj);font-size:12px;font-weight:600;color:var(--t2);cursor:pointer}
.menu a:hover{background:#f2f7fc}.menu a .material-symbols-outlined{font-size:16px;color:var(--t4)}

/* modal */
.overlay{position:absolute;inset:0;background:rgba(28,42,52,.44);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:60;animation:fade .2s ease}
.overlay.open{display:flex}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:560px;max-width:92%;background:#fff;border-radius:20px;box-shadow:var(--shadow-lg);overflow:hidden;animation:pop .2s ease}
.modal-hd{padding:16px 20px;display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#5d95c8,#3d7e96);color:#fff}
.modal-hd .mt{font-family:var(--pj);font-size:15px;font-weight:800;flex:1}
.modal-hd .mc{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff}
.modal-bd{padding:18px 20px;max-height:460px;overflow-y:auto}
.modal-ft{padding:13px 20px;border-top:1px solid var(--border-2);display:flex;justify-content:flex-end;gap:9px;background:#fbfdfe}
.opt-row{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--border);border-radius:11px;margin-bottom:8px;cursor:pointer}
.opt-row:hover{background:#f6faff}
.opt-row .ck{width:20px;height:20px;border-radius:6px;border:2px solid #cfdde9;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opt-row.on .ck{background:var(--primary);border-color:var(--primary)}
.opt-row .ck .material-symbols-outlined{font-size:14px;color:#fff;opacity:0}.opt-row.on .ck .material-symbols-outlined{opacity:1}
.opt-row .ot{font-family:var(--pj);font-size:12px;font-weight:700;color:var(--t1)}.opt-row .od{font-size:10.5px;color:var(--t4)}
.seg{display:flex;background:#eef1f3;border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;height:32px;border:none;border-radius:8px;background:transparent;cursor:pointer;font-family:var(--pj);font-size:12px;font-weight:700;color:var(--t3)}
.seg button.on{background:#fff;box-shadow:var(--shadow);color:var(--primary-deep)}

/* toast + fab */
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#1c2a34;color:#fff;font-family:var(--pj);font-size:12.5px;font-weight:600;padding:11px 18px;border-radius:12px;box-shadow:var(--shadow-lg);z-index:200;opacity:0;transition:.25s;display:flex;align-items:center;gap:8px;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast .material-symbols-outlined{font-size:17px;color:#7fd9c0}
.fadein{animation:vin .28s ease}@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.subnav.hide{display:none}
.set-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.set-tab{display:flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,.85);font-family:var(--pj);font-size:12.5px;font-weight:700;color:var(--t3);cursor:pointer}
.set-tab .material-symbols-outlined{font-size:17px;color:var(--t4)}
.set-tab:hover{background:#f2f7fc}
.set-tab.on{background:linear-gradient(135deg,#e6f0fa,#dbeaf7);border-color:#cfe0f1;color:var(--primary-deep)}
.set-tab.on .material-symbols-outlined{color:var(--primary)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--pj);font-size:11.5px;font-weight:700;color:var(--t2)}
.inp{height:38px;border:1px solid var(--border);border-radius:11px;padding:0 12px;font-family:var(--in);font-size:12.5px;color:var(--t1);background:#fff;display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:8px}
.inp:hover{border-color:#cfe0f1}.inp .material-symbols-outlined{font-size:17px;color:var(--t4)}
.finput{height:38px;width:100%;border:1px solid var(--border);border-radius:11px;padding:0 12px;font-family:var(--in);font-size:12.5px;color:var(--t1);background:#fff;outline:none}
.finput:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(61,126,150,.13)}
textarea.finput{min-height:80px;padding:10px 12px;resize:vertical;font-family:var(--in)}
/* data confidence badge */
.conf-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:7px;font-family:var(--pj);font-size:9.5px;font-weight:800;white-space:nowrap}
.conf-badge .material-symbols-outlined{font-size:12px}
/* directory table view */
.dirtable-wrap{overflow-x:auto}
.dirtable th{cursor:pointer;user-select:none;white-space:nowrap}
.dirtable th .material-symbols-outlined{font-size:14px;vertical-align:-3px;color:var(--t4)}
.dirtable th.sorted{color:var(--primary-deep)}
.dirtable td{white-space:nowrap}
.rowchk{width:16px;height:16px;border-radius:5px;border:1.5px solid #cdd8e1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;background:#fff;flex-shrink:0}
.rowchk.on{background:var(--primary);border-color:var(--primary);color:#fff}
.rowchk .material-symbols-outlined{font-size:12px}
.bulkbar{position:sticky;bottom:14px;display:flex;align-items:center;gap:12px;margin-top:14px;background:linear-gradient(120deg,#233b47,#2f5064);color:#fff;border-radius:16px;padding:12px 18px;box-shadow:var(--shadow-lg);animation:pop .18s ease}
.bulkbar b{font-family:var(--pj)}
.bulkbar .btn-ghost{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.24)}
.bulkbar .btn-ghost:hover{background:rgba(255,255,255,.2)}
.colpop{position:absolute;top:44px;right:0;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);padding:10px;z-index:20;width:190px}
.ca-post{border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.ca-post summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 14px}
.ca-post summary::-webkit-details-marker{display:none}
.ca-post .cathumb{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.ca-post .cathumb .material-symbols-outlined{font-size:19px}
.ca-post .caq{display:flex;gap:16px;margin-left:auto;flex-shrink:0}
.ca-post .caq div{text-align:right}
.ca-post .caq .cv{font-family:var(--pj);font-size:12.5px;font-weight:800;color:var(--t1)}
.ca-post .caq .cl{font-size:9.5px;color:var(--t4);text-transform:uppercase;letter-spacing:.03em}
.ca-post .chev{color:var(--t4);transition:.2s}
.ca-post[open] .chev{transform:rotate(180deg)}
.ca-post[open] summary{border-bottom:1px solid var(--border-2)}
.ca-detail{padding:14px 14px 16px}
.ca-metrics{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:12px}
.ca-metrics .cm{text-align:center;padding:9px 4px;border-radius:10px;background:#f7fafc;border:1px solid var(--border-2)}
.ca-metrics .cm .cv{font-family:var(--pj);font-size:13px;font-weight:800;color:var(--t1)}
.ca-metrics .cm .cl{font-size:9px;color:var(--t4);margin-top:2px}
.tag-paid{background:var(--peach-bg);color:var(--peach-ink)}
.tag-organic{background:var(--mint-bg);color:var(--mint-ink)}
.colpop label{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:9px;font-size:12px;color:var(--t2);cursor:pointer}
.colpop label:hover{background:#f2f7fc}
.colpop input{accent-color:var(--primary)}
/* advanced filter drawer */
.fdrawer{width:640px;max-width:94%}
.fdrawer .modal-bd{max-height:64vh}
.fgroup{margin-bottom:18px}
.fgroup-t{font-family:var(--pj);font-size:11.5px;font-weight:800;color:var(--t2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:9px;display:flex;align-items:center;gap:6px}
.fgroup-t .material-symbols-outlined{font-size:15px;color:var(--primary)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frange{display:flex;align-items:center;gap:9px}
.frange input[type=range]{flex:1;accent-color:var(--primary)}
.frange .fval{font-family:var(--pj);font-size:11.5px;font-weight:800;color:var(--primary-deep);min-width:40px;text-align:right}
.fsec{border-bottom:1px solid var(--border-2)}
.fsec:last-child{border-bottom:none}
.fsec-hd{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;padding:10px 2px}
.fsec-hd:hover .fsec-label{color:var(--primary-deep)}

function filterCamps(){const f=state.cm;const q=f.q.toLowerCase();
 return CAMPS2.filter(c=>{const a=cAgg(c);
  if(q&&!((c.name+' '+c.brand).toLowerCase().includes(q)||c.creators.some(r=>CK(r).name.toLowerCase().includes(q))))return false;
  if(f.status!=='all'&&c.status!==f.status)return false;
  if(f.brand!=='all'&&c.brand!==f.brand)return false;
  if(f.creator!=='all'&&!c.creators.some(r=>CK(r).name===f.creator))return false;
  if(f.plat!=='all'&&!c.creators.some(r=>(CK(r).plat||[]).includes(f.plat)))return false;
  if(f.type!=='all'&&c.type!==f.type)return false;
  if(c.budget<f.budget)return false;
  if(f.date!=='all'&&!c.start.includes(f.date)&&!c.end.includes(f.date))return false;
  if(f.delivT!=='all'&&!c.creators.some(r=>r.dt.includes(f.delivT)))return false;

function startProfiling(handle,plat){state.profiling={handle:handle||'@newcreator',plat:plat||'instagram',step:0,done:false,kid:null};state.dvTab='profiling';goSection('discover');profTick();}
function profTick(){const p=state.profiling;if(!p||p.done)return;
 setTimeout(()=>{const p2=state.profiling;if(!p2||p2.done)return;p2.step++;
  if(p2.step>=PROF_STEPS.length){const nk=buildNewKol(p2.handle,p2.plat);KOLS.push(nk);state.roster.add(nk.id);p2.done=true;p2.kid=nk.id;}
  if(state.section==='discover')rerender();
  if(!p2.done)profTick();},600);}

function rosterToggle(id){state.roster.has(id)?(state.roster.delete(id),toast(K(id).name+' removed from My Creators')):(state.roster.add(id),toast(K(id).name+' added to My Creators — your organization’s roster'));rerender();}

function trackPause(id){if(state.tracked[id]){state.tracked[id].status='paused';rerender();toast('Tracking paused for '+K(id).name);}}
function trackResume(id){if(state.tracked[id]){state.tracked[id].status='active';state.tracked[id].next='in 6 hours';rerender();toast('Tracking resumed for '+K(id).name);}}
function trackRefresh(id){if(!state.tracked[id])return;state.tracked[id].last='Just now';state.tracked[id].next='in 6 hours';rerender();toast('Fresh data pulled for '+K(id).name);}
function sdUseRef(id){state.sdRef=id;state.sdResults=null;state.dvTab='smart';state.dvSel=null;state.section==='discover'?rerender():goSection('discover');toast(K(id).name+' selected as Smart Discovery reference');}
function sdSetReq(k2,v){state.sdReq[k2]=v;rerender();}
function sdRun(){const ref=K(state.sdRef);if(!ref){toast('Pick a reference creator first');return;}
 const rq=state.sdReq;const rF=parseNum(ref.foll);const rE=parseFloat(ref.er);const out=[];
 KOLS.forEach(k=>{if(k.id===ref.id)return;
  if(rq.cat==='same'&&k.cat!==ref.cat)return;
  if(rq.plat==='same'&&!k.plat.some(p2=>ref.plat.includes(p2)))return;
  if(rq.tier==='same'&&TIER(k.foll)!==TIER(ref.foll))return;
  if(rq.loc==='same'&&k.loc!==ref.loc)return;
  if(rq.budget==='lower'&&k.rate>=ref.rate)return;
  let sc=0;const why=[];
  if(k.cat===ref.cat){sc+=3;why.push('Similar '+ref.cat.toLowerCase()+' category');}
  const shared=k.plat.filter(p2=>ref.plat.includes(p2)&&p2!=='facebook');
  if(shared.length){sc+=2;why.push('Same platform ('+shared.map(p2=>APP_NAME[p2]||p2).join(', ')+')');}
  const eD=Math.abs(parseFloat(k.er)-rE);if(eD<=1.3){sc+=2;why.push('Similar engagement pattern ('+k.er+' vs '+ref.er+')');}
  const fR=parseNum(k.foll)/Math.max(1,rF);if(fR>=.2&&fR<=2.2){sc+=1.5;why.push('Comparable audience size ('+k.foll+')');}
  if(k.ageTop===ref.ageTop){sc+=1.5;why.push('Similar audience profile ('+k.ageTop+' core age)');}
  if(k.loc===ref.loc){sc+=1;why.push('Same location ('+k.loc+')');}
  if(k.rate<ref.rate){sc+=1;why.push('Lower estimated price ($'+k.rate+' vs $'+ref.rate+')');}
  if(why.length)out.push({id:k.id,sc,why});});
 out.sort((a,b)=>b.sc-a.sc);state.sdResults=out.slice(0,5);rerender();
 toast(state.sdResults.length?state.sdResults.length+' similar creators found & ranked':'No creators match — loosen the requirements');}

   DATA RULE: every signal below is computed from fields that actually exist on the

   cpe, gF, ageTop, audLoc, interests, format, postFreq, rate, plat) or from internal

const iqNum=s=>{if(s==null)return null;if(typeof s==='number')return s;const m=String(s).replace(/[$+%,]/g,'');const n=parseFloat(m);if(isNaN(n))return null;return /M/i.test(s)?n*1e6:/K/i.test(s)?n*1e3:n;};

function iqCatStats(){const st={cat:{},loc:{},growth:{}};KOLS.forEach(k=>{st.cat[k.cat]=(st.cat[k.cat]||0)+1;st.loc[k.loc]=(st.loc[k.loc]||0)+1;const g=iqNum(k.growth);if(g!=null){st.growth[k.cat]=st.growth[k.cat]||[];st.growth[k.cat].push(g);}});return st;}
function iqCatLeader(cat){let best=null;KOLS.forEach(k=>{if(k.cat===cat&&(!best||k.q>best.q))best=k;});return best;}

function iqOverlap(a,b){if(!a||!b)return null;if(a.ageTop==null||b.ageTop==null)return null;let o=0;if(a.ageTop===b.ageTop)o+=40;if(a.audLoc&&a.audLoc===b.audLoc)o+=30;const ia=a.interests||[],ib=b.interests||[];if(ia.length&&ib.length){const sh=ia.filter(x=>ib.includes(x)).length;o+=Math.round(30*sh/Math.max(ia.length,ib.length));}return o;}
function iqCollabState(kid){const negos=state.negos||[];const done=negos.some(n=>n.kid===kid&&['paid','completed','active','evaluation','payment-pending'].includes(n.stage));const any=negos.some(n=>n.kid===kid)||[...(state.cart||[])].includes(kid);return {newToBrand:!any,repeat:done};}
/* master signal computation — returns nulls where source data is missing */
function intel(k){
 if(k._iq&&k._iq._v===(state._iqv||0))return k._iq;
 const st=iqCatStats();
 const er=iqNum(k.er),foll=iqNum(k.foll),growth=iqNum(k.growth),cpe=iqNum(k.cpe),reach=iqNum(k.reach),views=iqNum(k.avgViews);

 let momentum=null,momClass=null,vol=null,viralDep=null;

  const g=growth!=null?growth:slope;

function advWhy(k,mode){const t=intel2(k);const w=iqWhy(k,mode).slice(0,3);
 if(t.saveRate!=null&&t.saveRate>=5)w.push('High save rate ('+t.saveRate+'% — strong purchase-consideration signal)');
 if(t.compSat==='low')w.push('Low competitor saturation ('+t.compN+' competitor collab'+(t.compN===1?'':'s')+')');
 if(t.compNoBrand)w.push('Category experience via competitors, but never worked with your brand');
 if(t.audType==='active')w.push('Active community (strength '+t.community+'/100 — high comments, shares, saves)');
 const catAvg=KOLS.filter(x=>x.cat===k.cat&&x.id!==k.id).map(x=>intel2(x).views).filter(Boolean);
 if(catAvg.length&&t.views){const r=t.views/(catAvg.reduce((a,b)=>a+b,0)/catAvg.length);if(r>=1.3)w.push(Math.round(r*10)/10+'× category-average views');}
 if(t.emerging)w.push('Emerging creator — growing before mainstream saturation');
 return [...new Set(w)].slice(0,6);}

 repRisk:(k,v2)=>{const t=intel2(k);return v2==='low'?(t.negSent==null||t.negSent<=10):(t.negSent!=null&&t.negSent>10);},
 risingF:(k,v2)=>['rising','exploding'].includes(intel2(k).gClass)||intel2(k).emerging,

const DF_STATUS={
 fresh:['🟢','Fresh','var(--success)','Data is within its expected update interval'],
 aging:['🟡','Aging','#c99a4f','Data is approaching its scheduled update deadline'],
 due:['🟠','Due for Update','#d98a3d','The scheduled update time has arrived'],
 outdated:['🔴','Outdated','var(--danger)','Data has exceeded its expected update interval'],

const DF_PRIO={high:['High Priority','Every 6 Hours',6],active:['Active Monitoring','Daily',24],standard:['Standard Monitoring','Weekly',168],low:['Low Priority','Monthly',720]};
function dfAgeH(k){const s=k.synced||'';if(/just now/.test(s))return 0;
 let m=s.match(/(\d+)\s*h/);if(m)return +m[1];
 m=s.match(/(\d+)\s*d/);if(m)return +m[1]*24;
 m=s.match(/(\d+)\s*mo/);if(m)return +m[1]*720;
 m=s.match(/(\d+)\s*w/);if(m)return +m[1]*168;
 return 12;}
function dfPrioOf(k){const t=intel2(k);
 const inCampaign=state.cart.has(k.id)||state.orderSel.has(k.id)||(state.negos||[]).some(n=>n.kid===k.id&&!['closed','rejected'].includes(n.stage));
 if(inCampaign||t.gClass==='exploding'||t.viralFreq==='frequent')return 'high';
 if(t.gClass==='rising'||state.tracked[k.id]||(k.camps||0)>=8)return 'active';
 if(t.gClass==='declining'&&(k.camps||0)<=5)return 'low';
 return 'standard';}
function dfInfo(k){
 const ageH=dfAgeH(k);const prio=dfPrioOf(k);const [prioLabel,freqLabel,freqH]=DF_PRIO[prio];
 const ratio=ageH/freqH;
 let status=ratio<0.5?'fresh':ratio<0.85?'aging':ratio<1.2?'due':'outdated';
 if(k.conf==='calculated')status='updating';
 else if(k.conf==='estimated'&&ratio>=0.04)status='failed';
 const score=Math.max(5,Math.round(100-Math.min(1.6,ratio)*50-(status==='failed'?30:0)-(status==='outdated'?10:0)));
 /* pretend-absolute timestamps anchored to today */
 const now=new Date('2026-09-02T15:00:00');
 const last=new Date(now-ageH*3600e3);
 const next=new Date(last.getTime()+freqH*3600e3);
 const fmt=d2=>d2.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})+', '+String(d2.getHours()).padStart(2,'0')+':'+String(d2.getMinutes()).padStart(2,'0');
 const nextH=Math.round((next-now)/3600e3);
 const nextStr=status==='updating'?'In progress now':status==='failed'?'Retry queued · within 2 hours':nextH<=0?'Overdue — queued next':nextH<=9?'Today':nextH<=24?'Within 24 hours':'In '+Math.ceil(nextH/24)+' days';
 return {ageH,ratio,prio,prioLabel,freqLabel,freqH,status,meta:DF_STATUS[status],score,nextH,
  lastAbs:fmt(last),nextAbs:fmt(next),lastRel:k.synced||'—'};}

   ${(()=>{return '';})()}${(ags.length||directs.length)?`<div style="margin:8px 0 4px;font-family:var(--pj);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--t4)">Payment setup · per KOL</div>
   ${directs.map(k=>`<div class="sum-row" style="font-size:11px"><span><b style="font-family:var(--pj);color:var(--t1)">${k.name.split(' ')[0]}</b> · Direct order — rate card price</span><span style="text-align:right">Due today <b>${money(kolTotal(k.id))}</b> · Future <b>$0</b> <span class="tag" style="background:#eef4fa;color:var(--t3);font-size:8px">Pay at checkout</span></span></div>`).join('')}
   ${ags.map(ag=>{const p3=ag.agr.payTerms;const F=ag.finalPrice;const dt=p3==='upfront'?F:p3==='split50'?Math.round(F/2):p3==='milestone'?Math.round(F*((ag.agr.milestones[0]||{}).pct||0)/100):0;return `<div class="sum-row" style="font-size:11px"><span><b style="font-family:var(--pj);color:var(--t1)">${K(ag.kid).name.split(' ')[0]}</b> · ${PAYT_LABEL[p3]}</span><span style="text-align:right">Due today <b>${money(dt)}</b> · Future <b>${money(F-dt)}</b> <span class="tag" style="background:#eef4fa;color:var(--t3);font-size:8px">${dt?'Initial due':'Payment Scheduled'}</span></span></div>`;}).join('')}

 const tab=state.negoTab==='terms'?'terms':state.negoTab==='chat'?'chat':'offer';

 const viewing=state.negoView&&state.negoView!==curKey&&canView[VIEWKEYS.indexOf(state.negoView)]?state.negoView:null;
 const review=state.negoStep!=null&&state.negoStep<sIdx?state.negoStep:null;
 const prog=`<div class="card" style="padding:9px 14px;margin-bottom:12px;display:flex;align-items:center;gap:4px;overflow-x:auto">${STEPS4.map((l,i)=>{const done=i<s4;const cur=i===s4;const rv=(review!=null&&((i===0&&review<=1)||(i===1&&review===2)||(i===2&&review>=3)))||viewing===VIEWKEYS[i];
  const click=cur?`state.negoView=null;state.negoStep=null;rerender()`:canView[i]?`state.negoView='${VIEWKEYS[i]}';state.negoStep=null;rerender()`:`stepJump('${n.id}',${i})`;
  return `${i?'<span style="width:14px;height:2px;background:'+(i<=s4?'var(--primary)':'var(--border)')+';border-radius:2px;flex-shrink:0"></span>':''}<span onclick="${click}" title="${done?'Review this completed stage':cur?'Current stage':'Click to advance — simulates the required steps. '+LOCK4[i]}" style="cursor:pointer;flex-shrink:0;display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:10px;font-weight:700;font-family:var(--pj);${rv?'outline:2px solid var(--lav-ink);':''}${done?'background:var(--success-bg);color:var(--success)':cur?'background:var(--primary);color:#fff':'background:#f2f6fb;color:var(--t4);opacity:.75'}">${done?'<span class="material-symbols-outlined" style="font-size:11px">check</span>':'<b>'+(i+1)+'</b>'}${i===2&&agreedBoth?'Agreement Ready':l}</span>`;}).join('')}
 <div style="flex:1"></div><span style="font-size:9px;color:var(--t4)">Offer Created · Counter · Final Terms are states inside this workspace — not separate pages</span></div>`;
 const header=`<div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;flex-wrap:wrap">

   <h2 style="font-family:var(--pj);font-size:18px;font-weight:800;color:var(--t1);margin:2px 0 1px">Negotiation Workspace</h2>

 const nyaBanner=(n.stage==='negotiation'&&n.status==='counter')?`<div class="card" style="padding:11px 16px;margin-bottom:12px;border-color:#e8a33d;background:linear-gradient(160deg,#fff8ec,#fff 70%);display:flex;align-items:center;gap:12px;flex-wrap:wrap">

  <div style="flex:1;min-width:200px"><b style="font-family:var(--pj);font-size:12px;color:var(--t1)">Offer Not Accepted · Not Yet Agreed</b><div style="font-size:10.5px;color:var(--t4)">The influencer has not accepted the current proposal — negotiation is still open.</div></div>

  ${admin?`<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-secondary btn-sm" onclick="openCounterModal('${n.id}')">Counter Again</button><button class="btn btn-ghost btn-sm" onclick="openRevisionModal('${n.id}')">Request Revision</button><button class="btn btn-ghost btn-sm" style="color:var(--danger)" onclick="openCloseModal('${n.id}')">Close Negotiation</button></div>`:''}</div>`:'';
 const centerTabs=`<div class="seg" style="width:270px;margin-bottom:10px"><button class="${tab==='terms'?'':'on'}" onclick="state.negoTab='offer';rerender()">Negotiation</button><button class="${tab==='terms'?'on':''}" onclick="state.negoTab='terms';rerender()">Agreement Terms</button></div>`;
 const chatBlock=negoCtxHTML(n)+negoActionsHTML(n);
 let center='';
 const viewBanner=viewing?`<div class="callout" style="margin-bottom:10px"><span class="material-symbols-outlined" style="color:var(--lav-ink)">history</span><div><div class="cl">Viewing completed stage — ${viewing.charAt(0).toUpperCase()+viewing.slice(1)}</div><div class="cb">Presentation review only — nothing is reset; the negotiated data stays exactly as agreed. <b style="cursor:pointer;color:var(--primary)" onclick="state.negoView=null;rerender()">Back to current stage</b></div></div></div>`:'';
 if(n.stage==='closed'){center=closedSummaryHTML(n);}
 else if(viewing==='offer')center=viewBanner+stepScreenHTML(n,0,false)+versionsHTML(n);
 else if(viewing==='negotiation')center=viewBanner+negoCtxHTML(n)+versionsHTML(n);
 else if(viewing==='agreement')center=viewBanner+termsTabHTML(n);
 else if(viewing==='checkout')center=viewBanner+quickCheckoutHTML(n)+(n.agr&&n.agr.schedule?scheduleCardHTML(n):'');
 else if(viewing==='campaign')center=viewBanner+campaignScreenHTML(n)+delivListHTML(n,false);
 else if(review==null&&n.stage==='agreed')center=dealPriceHTML(n)+quickCheckoutHTML(n)+termsTabHTML(n);

 else if(review!=null){center=`<div class="callout" style="margin-bottom:10px"><span class="material-symbols-outlined" style="color:var(--lav-ink)">history</span><div><div class="cl">Reviewing Step ${review+1} — ${STEPNAMES[review]} (completed)</div><div class="cb">Read-only review. Completed information cannot be edited here — use Request Change in the active step. <b style="cursor:pointer;color:var(--primary)" onclick="state.negoStep=null;rerender()">Back to current step</b></div></div></div>`+stepScreenHTML(n,review,false);}
 else if(n.stage==='draft'&&tab!=='terms')center=(n.offers.length?`<div class="callout" style="margin-bottom:10px"><span class="material-symbols-outlined" style="color:var(--primary)">history</span><div><div class="cl">New offer draft — history preserved</div><div class="cb">${n.offers.length} previous version${n.offers.length>1?'s':''} and the full chat stay attached.</div></div></div>`:'')+offerComposerHTML(n)+(n.offers.length?versionsHTML(n):'');
 else if(tab==='terms')center=sIdx===3?stepScreenHTML(n,3,true)+`<div class="callout"><span class="material-symbols-outlined" style="color:var(--primary)">gavel</span><div><div class="cl">Agreement opens after this step</div><div class="cb">Confirm the Final Terms above with “Proceed to Agreement” — the contract screen loads next.</div></div></div>`:(sIdx===4?stepScreenHTML(n,4,true):'')+termsTabHTML(n);
 else if(tab==='offer'||tab==='chat')center=(sIdx<=1&&n.stage==='negotiation'?stepScreenHTML(n,sIdx,true):'')+(sIdx===2?negoCtxHTML(n):'')+negoActionsHTML(n)+versionsHTML(n);

 ['Offer','The price and terms you propose to the creator.'],
 ['Counter Offer','The creator’s reply with a different price. You can accept it, or reply with your own number.'],
 ['Deliverables','The content the creator will make for you — e.g. 1 Feed Post, 2 Stories.'],
 ['KPI / Target','The result you aim for — e.g. how many people should see the content (Reach) or interact with it (Engagement).'],
 ['Agreement','The final contract: locked price, content, dates and payment rules that both sides accepted.'],
 ['Guaranteed Fee','The part of the price the creator always receives once the agreed content is delivered — protected even if results are low.'],

 ['Engagement','Likes + comments — how much people interact with the content.'],
 ['Engagement Rate (ER)','Engagement divided by followers — a fairness measure across big and small creators.'],
